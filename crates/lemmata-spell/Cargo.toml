[package]
name = "lemmata-spell"
description = "Hunspell-compatible spell checking for LaTeX prose"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
spellbook = "0.4"
serde.workspace = true
# Same reqwest/rustls line as lemmata-bib: ring is the only TLS crypto stack.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy", "gzip"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
ring = "0.17"

[dev-dependencies]
# What the two legacy encodings in remote.rs are checked against.
encoding_rs = "0.8"
tempfile.workspace = true
tokio.workspace = true
