[package]
name = "lemmata-bib"
description = "Bibliography entries for citation search, and adding references by DOI or arXiv ID"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lemmata-project.workspace = true
serde.workspace = true
regex.workspace = true
biblatex = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "charset", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
