name: Release

# Push a tag made by scripts/release.sh (vX.Y.Z or vX.Y.Z-rc.N). A plain tag is a production release (the
# "latest" one, with the updater manifest); a tag with a suffix is a GitHub pre-release that the updater and the
# website's "latest" link never see.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cheap checks that should fail before 40 minutes of builds: the tag has the
  # form scripts/release.sh makes, and every version field agrees with it.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag and the version fields
        shell: bash
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-suffix. Use scripts/release.sh."
            exit 1
          fi
          version=${GITHUB_REF_NAME#v}
          cargo_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [[ "$cargo_version" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($cargo_version)."
            exit 1
          fi

  # The full CI on the tagged commit: nothing is published unless it passes. The builds run meanwhile.
  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux_x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - label: linux_aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - label: macos_universal
            runner: macos-14
            target: universal-apple-darwin
            bundles: app,dmg
          - label: windows_x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,wix
    runs-on: ${{ matrix.runner }}
    env:
      # The updater's signatures, with the key the Tauri builds used (the app checks them against its public key).
      CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: false

      # Prebuilt where there are binaries (cargo-binstall), built from source otherwise.
      - name: Install the packagers
        uses: taiki-e/install-action@v2
        with:
          tool: ${{ runner.os == 'Linux' && 'cargo-packager,cargo-generate-rpm' || 'cargo-packager' }}
          fallback: cargo-binstall

      - name: Build and package
        shell: bash
        run: |
          bundles='${{ matrix.bundles }}'
          # WiX can't version an MSI with a pre-release suffix, so betas ship the NSIS installer only.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then bundles=${bundles//,wix/}; fi
          scripts/package-app.sh ${{ matrix.target }} "$bundles"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          path: |
            target/packager/*.AppImage*
            target/packager/*.deb
            target/packager/*.rpm
            target/packager/*.dmg
            target/packager/*.app.tar.gz*
            target/packager/*-setup.exe*
            target/packager/*.msi
          if-no-files-found: error

  # The command-line tool, as archives on the release (scripts/package-cli.sh; CI runs it on every push too).
  cli:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux_x86_64, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { label: linux_aarch64, runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { label: macos_universal, runner: macos-14, target: universal }
          - { label: windows_x86_64, runner: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
          save-if: false
      - name: Build and pack
        shell: bash
        run: scripts/package-cli.sh "${GITHUB_REF_NAME#v}" ${{ matrix.label }} ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: cli_${{ matrix.label }}
          path: dist/lemmata-cli_*
          if-no-files-found: error

  publish:
    needs: [build, cli, ci]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      plain: ${{ steps.meta.outputs.plain }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - id: meta
        run: |
          version=${GITHUB_REF_NAME#v}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "plain=false"; else echo "plain=true"; fi >> "$GITHUB_OUTPUT"
      - name: Rename assets, write checksums and updater manifest
        run: python3 -I scripts/finalize-release.py artifacts dist "${{ steps.meta.outputs.version }}" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
      # Old clients can't be patched, so nothing is published unless every file the updater
      # manifest names is here, under its own name, and verifies with the key built into the app.
      - name: Check the updater manifest
        run: |
          [[ -f dist/latest.json ]] || exit 0
          sudo apt-get install -y minisign >/dev/null
          grep -m1 'const PUBLIC_KEY' crates/lemmata-shell/src/update.rs | cut -d'"' -f2 | base64 -d > key.pub
          python3 -I scripts/updater-files.py dist/latest.json > checks.txt
          while read -r file sig; do
            [[ -f "dist/$file" ]] || { echo "::error::latest.json names $file, which is not in dist/"; exit 1; }
            echo "$sig" | base64 -d > file.minisig
            minisign -Vq -p key.pub -m "dist/$file" -x file.minisig || { echo "::error::$file does not verify against the app's public key"; exit 1; }
          done < checks.txt
      # This version's section of CHANGELOG.md, so notes edited there by hand are the ones published.
      - name: Release notes
        run: |
          awk -v v="## ${GITHUB_REF_NAME#v} " 'index($0, v) == 1 {on = 1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; }
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ steps.meta.outputs.plain }}" == "true" ]]; then flag=--latest; else flag=--prerelease; fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "Lemmata ${{ steps.meta.outputs.version }}" --notes-file notes.md $flag

  aur:
    needs: publish
    if: needs.publish.outputs.plain == 'true'
    runs-on: ubuntu-latest
    env:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Render PKGBUILD
        if: env.AUR_SSH_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS.txt
          export SHA_X86_64=$(grep "_linux_x86_64.deb$" SHA256SUMS.txt | cut -d' ' -f1)
          export SHA_AARCH64=$(grep "_linux_aarch64.deb$" SHA256SUMS.txt | cut -d' ' -f1)
          envsubst '$VERSION $SHA_X86_64 $SHA_AARCH64' < packaging/aur/PKGBUILD.in > PKGBUILD
          cat PKGBUILD
      - name: Push to the AUR
        if: env.AUR_SSH_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@da03e160361ce01bf087e790b6ffd196d7dccff7 # v4.1.3 (pinned: this step receives the AUR key)
        with:
          pkgname: lemmata-bin
          pkgbuild: ./PKGBUILD
          commit_username: Nils Briggen
          commit_email: NilsBriggen@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          commit_message: Update to ${{ needs.publish.outputs.version }}

  homebrew:
    needs: publish
    if: needs.publish.outputs.plain == 'true'
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Update the cask in NilsBriggen/homebrew-tap
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS.txt
          export SHA_DMG=$(grep "_macos_universal.dmg$" SHA256SUMS.txt | cut -d' ' -f1)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/NilsBriggen/homebrew-tap.git" tap
          mkdir -p tap/Casks
          envsubst '$VERSION $SHA_DMG' < packaging/homebrew/lemmata.rb.in > tap/Casks/lemmata.rb
          cd tap
          git config user.name "Nils Briggen"
          git config user.email "NilsBriggen@users.noreply.github.com"
          git add Casks/lemmata.rb
          git commit -m "lemmata $VERSION"
          git push

  winget:
    needs: publish
    if: needs.publish.outputs.plain == 'true'
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Open a PR to microsoft/winget-pkgs
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2 (pinned: this step receives the winget token)
        with:
          identifier: NilsBriggen.Lemmata
          installers-regex: '_windows_x86_64-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

  website:
    needs: publish
    runs-on: ubuntu-latest
    env:
      WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
      WEBSITE_REPO: ${{ vars.WEBSITE_REPO }}
    steps:
      - name: Ask the website to rebuild
        if: env.WEBSITE_DISPATCH_TOKEN != '' && env.WEBSITE_REPO != ''
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: gh api "repos/$WEBSITE_REPO/dispatches" -f event_type=release-published -f "client_payload[tag]=$GITHUB_REF_NAME"
