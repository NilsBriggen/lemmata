name: Release

# Push a tag made by scripts/release.sh (vX.Y.Z or vX.Y.Z-rc.N). A plain tag is a production release (the
# "latest" one, with the updater manifest); a tag with a suffix is a GitHub pre-release that the updater and the
# website's "latest" link never see.
on:
  push:
    tags: ["v*"]

# Read-only by default: only the publish job writes the release (it says so itself). The build
# jobs hold the signing key and run third-party actions, pinned to commits for that reason.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cheap checks that should fail before 40 minutes of builds: the tag has the
  # form scripts/release.sh makes, and every version field agrees with it.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag and the version fields
        shell: bash
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-suffix. Use scripts/release.sh prepare and tag."
            exit 1
          fi
          version=${GITHUB_REF_NAME#v}
          cargo_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [[ "$cargo_version" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($cargo_version)."
            exit 1
          fi
      # What publishing needs, checked before 40 minutes of builds and before the release is public:
      # a missing token or notes would otherwise leave a half-published release.
      - name: Check the publishing secrets and the release notes
        shell: bash
        env:
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          WEBSITE_REPO: ${{ vars.WEBSITE_REPO }}
        run: |
          # The website job runs for every release.
          needed="WEBSITE_DISPATCH_TOKEN WEBSITE_REPO"
          missing=""
          for name in $needed; do [[ -n "${!name}" ]] || missing="$missing $name"; done
          if [[ -n "$missing" ]]; then
            echo "::error::Not set:$missing. The release would be published only in part."
            exit 1
          fi
          awk -v v="## ${GITHUB_REF_NAME#v} " 'index($0, v) == 1 {on = 1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}, or it is blank"; exit 1; }

  # The full CI on the tagged commit: nothing is published unless it passes. The builds run meanwhile.
  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  # MiKTeX builds and the app's tests on Windows.
  windows:
    needs: verify
    uses: ./.github/workflows/windows.yml

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux_x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - label: linux_aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - label: windows_x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,wix
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@263313d2989f864a2b8613f97277288638e7d8f8 # 1.99.1
        with:
          targets: ${{ matrix.target }}
      # Restores what warm-release-cache.yml built on main; a tag's own cache would never be hit again.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release-${{ matrix.target }}
          save-if: false

      # Prebuilt where there are binaries (cargo-binstall), built from source otherwise.
      - name: Install the packagers
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: ${{ runner.os == 'Linux' && 'cargo-packager@0.11.8,cargo-generate-rpm@0.21.1' || 'cargo-packager@0.11.8' }}
          fallback: cargo-binstall

      - name: Build and package
        shell: bash
        # The updater's signatures, with the key the Tauri builds used (the app checks them against
        # its public key). On this step only: rust-cache folds CARGO_* variables into its key.
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bundles='${{ matrix.bundles }}'
          # WiX can't version an MSI with a pre-release suffix, so betas ship the NSIS installer only.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then bundles=${bundles//,wix/}; fi
          # The updater only installs builds signed after this version's own commit (update.rs).
          export LEMMATA_RELEASE_EPOCH=$(git log -1 --format=%ct)
          scripts/package-app.sh ${{ matrix.target }} "$bundles"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.label }}
          path: |
            target/packager/*.AppImage*
            target/packager/*.deb
            target/packager/*.rpm
            target/packager/*.dmg
            target/packager/*.app.tar.gz*
            target/packager/*-setup.exe*
            target/packager/*.msi
          if-no-files-found: error

  # The Mac app is one program for both architectures. Building them one after the other took
  # most of the release's time, so each builds on its own runner and `macos` joins them.
  macos-bin:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@263313d2989f864a2b8613f97277288638e7d8f8 # 1.99.1
        with:
          targets: ${{ matrix.arch }}-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release-${{ matrix.arch }}-apple-darwin
          save-if: false
      # LEMMATA_RELEASE_EPOCH: the updater only installs builds signed after this commit (update.rs).
      - run: LEMMATA_RELEASE_EPOCH=$(git log -1 --format=%ct) cargo build --locked --release -p lemmata-app --target ${{ matrix.arch }}-apple-darwin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-bin-${{ matrix.arch }}
          path: target/${{ matrix.arch }}-apple-darwin/release/lemmata-app
          if-no-files-found: error
          retention-days: 1

  macos:
    needs: macos-bin
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@263313d2989f864a2b8613f97277288638e7d8f8 # 1.99.1
      - name: Install the packager
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-packager@0.11.8
          fallback: cargo-binstall
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-bin-aarch64
          path: target/aarch64-apple-darwin/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-bin-x86_64
          path: target/x86_64-apple-darwin/release
      - name: Package
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          chmod +x target/*-apple-darwin/release/lemmata-app
          PREBUILT=1 scripts/package-app.sh universal-apple-darwin app,dmg
      # The name finalize-release.py expects.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos_universal
          path: |
            target/packager/*.dmg
            target/packager/*.app.tar.gz*
          if-no-files-found: error

  # The command-line tool, as archives on the release (scripts/package-cli.sh; CI runs it on every push too).
  cli:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux_x86_64, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { label: linux_aarch64, runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { label: macos_universal, runner: macos-15, target: universal }
          - { label: windows_x86_64, runner: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@263313d2989f864a2b8613f97277288638e7d8f8 # 1.99.1
        with:
          targets: ${{ matrix.target == 'universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: cli-${{ matrix.target }}
          save-if: false
      - name: Build and pack
        shell: bash
        run: scripts/package-cli.sh "${GITHUB_REF_NAME#v}" ${{ matrix.label }} ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli_${{ matrix.label }}
          path: dist/lemmata-cli_*
          if-no-files-found: error

  publish:
    needs: [build, macos, cli, ci, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      plain: ${{ steps.meta.outputs.plain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - id: meta
        run: |
          version=${GITHUB_REF_NAME#v}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "plain=false"; else echo "plain=true"; fi >> "$GITHUB_OUTPUT"
      - name: Rename assets, write checksums and updater manifest
        run: python3 -I scripts/finalize-release.py artifacts dist "${{ steps.meta.outputs.version }}" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
      # Old clients can't be patched, so nothing is published unless every file the updater
      # manifest names is here, under its own name, and verifies with the key built into the app.
      - name: Check the updater manifest
        run: |
          if [[ ! -f dist/latest.json ]]; then
            [[ "${{ steps.meta.outputs.plain }}" == "false" ]] && exit 0 # pre-releases have none
            echo "::error::a stable release without latest.json: no one would be offered it"; exit 1
          fi
          sudo apt-get install -y minisign >/dev/null
          grep -m1 'const PUBLIC_KEY' crates/lemmata-shell/src/update.rs | cut -d'"' -f2 | base64 -d > key.pub
          python3 -I scripts/updater-files.py dist/latest.json > checks.txt
          while read -r file sig; do
            [[ -f "dist/$file" ]] || { echo "::error::latest.json names $file, which is not in dist/"; exit 1; }
            echo "$sig" | base64 -d > file.minisig
            minisign -Vq -p key.pub -m "dist/$file" -x file.minisig || { echo "::error::$file does not verify against the app's public key"; exit 1; }
          done < checks.txt
      # This version's section of CHANGELOG.md, so notes edited there by hand are the ones published.
      - name: Release notes
        run: |
          awk -v v="## ${GITHUB_REF_NAME#v} " 'index($0, v) == 1 {on = 1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}, or it is blank"; exit 1; }
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ steps.meta.outputs.plain }}" == "true" ]]; then flag=--latest; else flag=--prerelease; fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "Lemmata ${{ steps.meta.outputs.version }}" --notes-file notes.md $flag

  website:
    needs: publish
    runs-on: ubuntu-latest
    env:
      WEBSITE_REPO: ${{ vars.WEBSITE_REPO }}
    steps:
      - name: Ask the website to rebuild
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: gh api "repos/$WEBSITE_REPO/dispatches" -f event_type=release-published -f "client_payload[tag]=$GITHUB_REF_NAME"
