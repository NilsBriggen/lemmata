name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter lemmata-desktop build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: pnpm check
      - run: python3 -I scripts/test_finalize_release.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # The desktop crate embeds the built frontend, so build it before cargo.
      - run: pnpm --filter lemmata-desktop build
      - run: cargo test --workspace
      - name: Build the app without bundling
        run: pnpm --filter lemmata-desktop tauri build --no-bundle

  tex-integration:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: |
            scheme-basic
            latexmk
            synctex
            biber
            biblatex
            lipsum
            amsmath
            collection-fontsrecommended
      - name: Build the CLI
        run: cargo build -p lemmata-cli
      - name: lemmata doctor
        run: target/debug/lemmata doctor
      - name: Compile fixtures and compare diagnostics
        run: scripts/check-fixtures.sh target/debug/lemmata

  templates:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: |
            scheme-basic
            latexmk
            synctex
            biber
            biblatex
            amsmath
            amsfonts
            amscls
            tools
            float
            colortbl
            booktabs
            fancyhdr
            geometry
            enumitem
            mdframed
            cleveref
            koma-script
            beamer
            beamertheme-metropolis
            collection-fontsrecommended
      - name: Build the CLI
        run: cargo build -p lemmata-cli
      - name: Build every template
        run: scripts/check-templates.sh target/debug/lemmata

  e2e:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - name: Install Tauri libraries, WebKit's WebDriver and a virtual display
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb
      - uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: |
            scheme-basic
            latexmk
            synctex
            biber
            biblatex
            amsmath
            amsfonts
            collection-fontsrecommended
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked --version 2.1.0
      - name: Build the app (debug, frontend embedded)
        run: pnpm --filter lemmata-desktop tauri build --debug --no-bundle
      - name: Run end-to-end tests
        run: xvfb-run --auto-servernum pnpm --filter lemmata-desktop e2e
