name: CI

# Docs-only changes skip CI (CHANGELOG.md is not ignored). release.yml also runs this workflow on the tagged
# commit and publishes only if it passes.
on:
  workflow_call:
  # By hand on any branch: Actions → CI → Run workflow.
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "!CHANGELOG.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "!CHANGELOG.md"

# A newer push to a pull request makes its older run pointless. On main every commit gets its own group, so a
# later push never cancels a run. Called from release.yml, github.workflow is "Release": its own group too.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A release commit is tested by release.yml on its tag (same commit), so its push to main skips every job here.
jobs:
  lint:
    if: ${{ !(github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore(release):')) }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: python3 -I scripts/test_finalize_release.py

  test:
    if: ${{ !(github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore(release):')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, cli: linux_x86_64, target: x86_64-unknown-linux-gnu }
          - { os: macos-14, cli: macos_universal, target: universal }
          - { os: windows-latest, cli: windows_x86_64, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The command-line tool ships as one binary for both Mac architectures.
          targets: ${{ matrix.target == 'universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # The app's UI tests draw with wgpu: Mesa's software Vulkan (lavapipe) where there is no GPU.
      - name: Install a software Vulkan driver
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      # Also builds the app on each OS, the macOS-only Apple Event code included.
      - run: cargo test --workspace
      # The Tectonic download and a real build on every OS (the first build fetches its packages, so it is slow).
      # One thread: the tests share Tectonic's package cache.
      - name: Tectonic installs and builds
        timeout-minutes: 20
        run: cargo test -p lemmata-tex -- --ignored --test-threads=1 --nocapture installs_the_pinned_release builds_a_project_with_bibtex_and_reports_errors fixture_with_biber_reports_the_limitation
      # The release's packaging, run here so it is tested on every push.
      - name: Package the command-line tool
        shell: bash
        run: scripts/package-cli.sh ci ${{ matrix.cli }} ${{ matrix.target }}
      # Release profile on one OS is enough to catch a broken release build.
      - name: Build the app in release mode
        if: runner.os == 'Linux'
        run: cargo build --release -p lemmata-app

  # The macOS test job runs on Apple silicon; the Intel download needs an Intel runner.
  tectonic-macos-intel:
    if: ${{ !(github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore(release):')) }}
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tectonic installs and builds
        timeout-minutes: 20
        run: cargo test -p lemmata-tex -- --ignored --test-threads=1 --nocapture installs_the_pinned_release builds_a_project_with_bibtex_and_reports_errors fixture_with_biber_reports_the_limitation

  # One TeX Live install and one CLI build serve both the fixture and the template checks.
  tex-integration:
    if: ${{ !(github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore(release):')) }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: |
            scheme-basic
            latexmk
            synctex
            biber
            biblatex
            lipsum
            amsmath
            amsfonts
            amscls
            tools
            float
            colortbl
            booktabs
            fancyhdr
            geometry
            enumitem
            mdframed
            zref
            needspace
            etoolbox
            cleveref
            koma-script
            beamer
            beamertheme-metropolis
            collection-fontsrecommended
            latexdiff
            ulem
            listings
            graphics
      - name: Build the CLI
        run: cargo build -p lemmata-cli
      - name: lemmata doctor
        run: target/debug/lemmata doctor
      - name: Compile fixtures and compare diagnostics
        run: scripts/check-fixtures.sh target/debug/lemmata
      - name: Build every template
        run: scripts/check-templates.sh target/debug/lemmata
      # latexdiff's markup needs ulem, color and listings; the test fails instead of skipping when any is missing.
      - name: PDF of the changes (latexdiff)
        run: cargo test -p lemmata-history --test latexdiff
        env:
          LEMMATA_REQUIRE_TEX: "1"

  # The app's scenarios (apps/lemmata/src/scenarios.rs) with a real TeX Live: without one they skip the builds.
  scenarios:
    if: ${{ !(github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore(release):')) }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: scenarios
      - name: Install a software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: |
            scheme-basic
            latexmk
            synctex
            biber
            biblatex
            lipsum
            amsmath
            amsfonts
            amscls
            tools
            float
            colortbl
            booktabs
            fancyhdr
            geometry
            enumitem
            mdframed
            zref
            needspace
            etoolbox
            cleveref
            koma-script
            beamer
            beamertheme-metropolis
            collection-fontsrecommended
            graphics
      # The Git panel scenario commits; runners have no git identity.
      - name: Set a git identity
        run: |
          git config --global user.name "Lemmata CI"
          git config --global user.email "ci@lemmata.invalid"
      - name: Run the app's tests and scenarios
        run: cargo test -p lemmata-app
