name: Audit

# Known vulnerabilities in dependencies. Separate from CI so an advisory in a
# crate we don't control never blocks a release; it opens a failing run to look at.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths: ["Cargo.lock", "pnpm-lock.yaml"]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo audit
        run: cargo install cargo-audit --locked && cargo audit

  node:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: pnpm audit
        run: pnpm audit --prod --audit-level high
