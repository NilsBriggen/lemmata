name: Windows

# Builds a document on Windows with a real MiKTeX in the situations that have
# broken for users (Perl missing, Perl failing to start) and reports timings,
# and runs the app's tests and scenarios on Windows.
# It runs on pushes to main that touch the build code (the paths below) and by hand:
# Actions → Windows → Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/lemmata-tex/**"
      - "crates/lemmata-cli/**"
      - "crates/lemmata-log/**"
      - "crates/lemmata-project/**"
      - "apps/lemmata/**"
      - "crates/lemmata-shell/**"
      - "scripts/windows-smoke.ps1"
      - ".github/workflows/windows.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job, so MiKTeX is installed once: the app's scenarios first, then the build scenarios.
  windows:
    # The version bump of a release changes nothing the tests cover; its code was tested on the commit before.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      # Not cached: the install writes to Program Files, ProgramData and the registry, so restoring only
      # the install dir would give a broken MiKTeX. The install is also not the slow part worth risking that for.
      # MiKTeX's own setup with a fixed CTAN mirror, not Chocolatey's package: left to choose a mirror, MiKTeX
      # asks api2.miktex.org, which has timed out from GitHub's runners since 2026-10-21.
      - name: Install MiKTeX
        shell: pwsh
        run: |
          # Real mirrors: MiKTeX refuses the mirrors.ctan.org redirector as "not registered".
          $mirrors = "https://ctan.math.illinois.edu", "https://mirrors.mit.edu/CTAN", "https://ftp.fau.de/ctan"
          # The setup from the same mirrors, the first that answers.
          $zip = "$env:RUNNER_TEMP\miktexsetup.zip"
          foreach ($m in $mirrors) {
            try {
              $setup = "$m/systems/win32/miktex/setup/windows-x64/"
              $name = (Invoke-WebRequest $setup -MaximumRetryCount 2).Links.href | Where-Object { $_ -match '^miktexsetup-.*-x64\.zip$' } | Select-Object -First 1
              Invoke-WebRequest "$setup$name" -OutFile $zip -MaximumRetryCount 2
              break
            } catch { Write-Warning "$m`: $_" }
          }
          if (-not (Test-Path $zip)) { throw "No mirror had miktexsetup" }
          Expand-Archive "$env:RUNNER_TEMP\miktexsetup.zip" "$env:RUNNER_TEMP\miktexsetup"
          $exe = "$env:RUNNER_TEMP\miktexsetup\miktexsetup_standalone.exe"
          $local = "$env:RUNNER_TEMP\miktex-repository"
          # Mirrors time out now and then: the next one is tried.
          foreach ($m in $mirrors) {
            $repo = "$m/systems/win32/miktex/tm/packages/"
            & $exe --verbose "--remote-package-repository=$repo" "--local-package-repository=$local" --package-set=basic download
            if ($LASTEXITCODE -eq 0) { break }
          }
          & $exe --verbose "--local-package-repository=$local" --package-set=basic --shared=yes "--common-install=C:\Program Files\MiKTeX" install
          $bin = "C:\Program Files\MiKTeX\miktex\bin\x64"
          if (-not (Test-Path "$bin\pdflatex.exe")) { throw "MiKTeX was not installed where expected" }
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          # Packages a build asks for come from the same mirror, again without asking api2.miktex.org, and
          # install without a prompt: for the whole machine and for this user, whose settings come first.
          foreach ($scope in @("--admin"), @()) {
            & "$bin\mpm.exe" @scope "--set-repository=$repo"
            & "$bin\initexmf.exe" @scope --set-config-value "[MPM]AutoInstall=1"
          }
      # The first build on a fresh MiKTeX installs packages for over a minute; do it before the tests' timeouts start.
      - name: Warm up MiKTeX
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "warmup"
          Copy-Item -Recurse tests/fixtures/article $dir
          Push-Location $dir
          latexmk -pdf -interaction=nonstopmode main.tex
          Pop-Location
          exit 0 # the fixture has deliberate warnings; only the package installs matter here
      # The Git panel scenario commits; runners have no git identity.
      - name: Set a git identity
        run: |
          git config --global user.name "Lemmata CI"
          git config --global user.email "ci@lemmata.invalid"
      # One at a time with real TeX: the log then names a test that hangs, and the limit stops it.
      - name: Run the app's tests and scenarios
        timeout-minutes: 30
        run: cargo test -p lemmata-app -- --test-threads=1
      # Debug build: it reuses the test build's dependencies, and the timings are TeX's anyway.
      - name: Build the command-line tool
        if: ${{ !cancelled() }}
        run: cargo build -p lemmata-cli
      - name: Build documents in each scenario
        if: ${{ !cancelled() }}
        shell: pwsh
        run: pwsh scripts/windows-smoke.ps1 target/debug/lemmata.exe
