name: Warm the release cache

# Builds the release on main whenever its dependencies change (and weekly, as caches expire), so a
# tag's build jobs restore compiled dependencies instead of starting cold. Tags can read caches
# saved on the default branch; release.yml's legs use the same shared keys and never save.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - ".github/workflows/warm-release-cache.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  warm:
    # A version bump changes Cargo.lock but nothing a dependency build depends on.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { runner: macos-14, target: aarch64-apple-darwin }
          - { runner: macos-14, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
      - run: cargo build --release -p lemmata-app --target ${{ matrix.target }}
