name: Package check

# The installers are built (unsigned) by scripts/package-app.sh only in release.yml, after the release
# commit and tag exist: a break there would cost a new version. This builds them on every change to
# what they are made from, and by hand (Actions → Package check → Run workflow).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/package-app.sh"
      - "packaging/**"
      - "apps/lemmata/Cargo.toml"
      - "templates/**"
      - "data/**"
      - "Cargo.lock"
      - ".github/workflows/package-check.yml"
  push:
    branches: [main]
    paths:
      - "scripts/package-app.sh"
      - "packaging/**"
      - "apps/lemmata/Cargo.toml"
      - "templates/**"
      - "data/**"
      - "Cargo.lock"
      - ".github/workflows/package-check.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    # A release commit is built by release.yml on its tag.
    if: ${{ !(github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore(release):')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: "appimage,deb,rpm" }
          - { runner: macos-15, target: universal-apple-darwin, bundles: "app,dmg" }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, bundles: "nsis,wix" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the packagers
        uses: taiki-e/install-action@v2
        with:
          tool: ${{ runner.os == 'Linux' && 'cargo-packager@0.11.8,cargo-generate-rpm@0.21.1' || 'cargo-packager@0.11.8' }}
          fallback: cargo-binstall
      - name: Build and package, unsigned
        shell: bash
        run: |
          export LEMMATA_RELEASE_EPOCH=$(git log -1 --format=%ct)
          scripts/package-app.sh ${{ matrix.target }} "${{ matrix.bundles }}"
