[package]
name = "lemmata-desktop"
description = "Lemmata desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "lemmata_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lemmata-tex.workspace = true
lemmata-log.workspace = true
lemmata-project.workspace = true
lemmata-synctex.workspace = true
lemmata-pkgmap.workspace = true
lemmata-history.workspace = true
lemmata-spell.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
which.workspace = true
toml.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt"] }
