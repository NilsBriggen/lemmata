[package]
name = "lemmata-desktop"
description = "Lemmata desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "lemmata_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lemmata-tex.workspace = true
lemmata-log.workspace = true
lemmata-project.workspace = true
lemmata-synctex.workspace = true
lemmata-pkgmap.workspace = true
lemmata-history.workspace = true
lemmata-spell.workspace = true
lemmata-bib.workspace = true
lemmata-grammar.workspace = true
lemmata-git.workspace = true
lemmata-env.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
which.workspace = true
toml.workspace = true
regex.workspace = true
trash = "5"
notify = "8"
notify-debouncer-mini = "0.7"
zip.workspace = true
# The template collection: the same reqwest/rustls/ring line as lemmata-bib and lemmata-spell.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "charset", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
ring = "0.17"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt"] }

# shortcut: tauri-plugin-deep-link 2.6.2 doesn't compile with rust-ini 0.21.3 (new ParseOption fields);
# drop this pin once a newer deep-link plugin builds without it.
[target.'cfg(target_os = "linux")'.dependencies]
rust-ini = "=0.21.1"
gtk = "0.18"
