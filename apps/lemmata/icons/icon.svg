<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#1f2b38"/>
      <stop offset="100%" stop-color="#111820"/>
    </linearGradient>
    <linearGradient id="rim2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="sheet2" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e5ecf2"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6dbbe9"/>
      <stop offset="100%" stop-color="#2a71a4"/>
    </linearGradient>
    <linearGradient id="fold2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bce2f9"/>
      <stop offset="100%" stop-color="#7bc3ee"/>
    </linearGradient>
    <filter id="sh2" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#060b10" flood-opacity="0.48"/>
    </filter>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg2)"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="110.5" fill="none" stroke="url(#rim2)" stroke-width="3"/>
  <g filter="url(#sh2)">
    <!-- Seamless sculpted L frame (source editor spine & baseline) -->
    <path fill="url(#sheet2)" d="
      M 114 114
      C 114 101, 125 90, 138 90
      L 172 90
      C 185 90, 196 101, 196 114
      L 196 312
      C 196 326, 207 336, 220 336
      L 374 336
      C 387 336, 398 347, 398 360
      L 398 394
      C 398 407, 387 418, 374 418
      L 164 418
      C 136 418, 114 396, 114 368
      Z"/>
    <!-- Nested Typeset PDF Card with crisp dog-ear fold -->
    <path fill="url(#card2)" d="
      M 232 114
      C 232 101, 243 90, 256 90
      L 336 90
      L 398 152
      L 398 278
      C 398 291, 387 302, 374 302
      L 256 302
      C 243 302, 232 291, 232 278
      Z"/>
    <path fill="url(#fold2)" d="
      M 336 90
      L 336 136
      C 336 145, 343 152, 352 152
      L 398 152
      Z"/>
    <!-- Two crisp minimal typeset bars (reads cleanly at 32px too) -->
    <rect x="266" y="186" width="98" height="16" rx="8" fill="#ffffff" fill-opacity="0.94"/>
    <rect x="266" y="222" width="68" height="14" rx="7" fill="#ffffff" fill-opacity="0.58"/>
  </g>
</svg>
