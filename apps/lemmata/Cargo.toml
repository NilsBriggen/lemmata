[package]
name = "lemmata-app"
description = "Lemmata, the LaTeX editor: the native egui interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "lemmata-app"
path = "src/main.rs"

[dependencies]
# Only what the app draws with: no bundled egui fonts, no GLES or WebGPU backends.
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "links",
    "system_fonts",
    "wayland",
    "x11",
    "wgpu_no_default_features",
] }
lemmata-project.workspace = true
lemmata-shell = { path = "../../crates/lemmata-shell" }
lemmata-tex.workspace = true
lemmata-log.workspace = true
lemmata-synctex.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
dirs = "7"
open = "5"
regex.workspace = true
ropey = "1.6"
unicode-segmentation = "1"
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "wayland", "tokio"] }
tokio.workspace = true
hayro = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "dx12", "wgsl"] }

[dev-dependencies]
# What eframe's `system_fonts` feature installs in the real app, for glyphs outside the bundled fonts.
egui_system_font_provider = "0.37"
tempfile.workspace = true
zip.workspace = true
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }
