# git-cliff config: CHANGELOG.md and release notes from Conventional Commits.
[changelog]
header = "# Changelog\n\nAll notable changes to Lemmata.\n"
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }}){% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}- {{ commit.message | split(pat="\n") | first | upper_first }}
{% endfor %}{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Faster" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(chore|ci|build|refactor|style|test)", skip = true },
]
tag_pattern = "v[0-9].*"
