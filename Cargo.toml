[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "2.1.3"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/NilsBriggen/lemmata"
authors = ["Nils Briggen"]

[workspace.dependencies]
lemmata-tex = { path = "crates/lemmata-tex" }
lemmata-log = { path = "crates/lemmata-log" }
lemmata-synctex = { path = "crates/lemmata-synctex" }
lemmata-project = { path = "crates/lemmata-project" }
lemmata-pkgmap = { path = "crates/lemmata-pkgmap" }
lemmata-history = { path = "crates/lemmata-history" }
lemmata-git = { path = "crates/lemmata-git" }
lemmata-spell = { path = "crates/lemmata-spell" }
lemmata-bib = { path = "crates/lemmata-bib" }
lemmata-grammar = { path = "crates/lemmata-grammar" }
lemmata-env = { path = "crates/lemmata-env" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["process", "sync", "time", "macros", "rt-multi-thread", "fs", "io-util"] }
thiserror = "2"
regex = "1"
which = "8"
walkdir = "2"
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
