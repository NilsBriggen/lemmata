[workspace]
resolver = "3"
members = ["crates/*", "apps/lemmata"]

[workspace.package]
version = "3.0.0-rc.4"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/NilsBriggen/lemmata"
authors = ["Nils Briggen"]

[workspace.dependencies]
lemmata-tex = { path = "crates/lemmata-tex" }
lemmata-log = { path = "crates/lemmata-log" }
lemmata-synctex = { path = "crates/lemmata-synctex" }
lemmata-project = { path = "crates/lemmata-project" }
lemmata-pkgmap = { path = "crates/lemmata-pkgmap" }
lemmata-history = { path = "crates/lemmata-history" }
lemmata-git = { path = "crates/lemmata-git" }
lemmata-spell = { path = "crates/lemmata-spell" }
lemmata-bib = { path = "crates/lemmata-bib" }
lemmata-grammar = { path = "crates/lemmata-grammar" }
lemmata-env = { path = "crates/lemmata-env" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["process", "sync", "time", "macros", "rt-multi-thread", "fs", "io-util"] }
thiserror = "2"
regex = "1"
which = "8"
walkdir = "2"
tempfile = "3"
# Deflate through flate2 and zlib-rs only: "deflate" adds zopfli, used just for levels above 9.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# One accessor added to hayro-interpret; see vendor/README.md.
[patch.crates-io]
hayro-interpret = { path = "vendor/hayro-interpret" }

[profile.release]
lto = "fat"
codegen-units = 1
# Unwinding, so a PDF that panics the renderer (apps/lemmata/src/pdf/engine.rs) is caught, not fatal.
panic = "unwind"
strip = true

# Size: dependencies are built for size, except the ones on every frame or keystroke
# (drawing, text, the PDF and maths renderers, spell check, regex, image decoding), which stay
# built for speed. The workspace's own crates keep opt-level 3.
[profile.release.package."*"]
opt-level = "s"

[profile.release.package.aho-corasick]
opt-level = 3

[profile.release.package.ecolor]
opt-level = 3

[profile.release.package.egui]
opt-level = 3

[profile.release.package.egui-wgpu]
opt-level = 3

[profile.release.package.egui-winit]
opt-level = 3

[profile.release.package.emath]
opt-level = 3

[profile.release.package.epaint]
opt-level = 3

[profile.release.package.fdeflate]
opt-level = 3

[profile.release.package.fearless_simd]
opt-level = 3

[profile.release.package.font-types]
opt-level = 3

[profile.release.package.gif]
opt-level = 3

[profile.release.package.harfrust]
opt-level = 3

[profile.release.package.hayro]
opt-level = 3

[profile.release.package.hayro-ccitt]
opt-level = 3

[profile.release.package.hayro-cmap]
opt-level = 3

[profile.release.package.hayro-interpret]
opt-level = 3

[profile.release.package.hayro-jbig2]
opt-level = 3

[profile.release.package.hayro-jpeg2000]
opt-level = 3

[profile.release.package.hayro-postscript]
opt-level = 3

[profile.release.package.hayro-syntax]
opt-level = 3

[profile.release.package.image]
opt-level = 3

[profile.release.package.image-webp]
opt-level = 3

[profile.release.package.kurbo]
opt-level = 3

[profile.release.package.memchr]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.peniko]
opt-level = 3

[profile.release.package.png]
opt-level = 3

[profile.release.package.ratex-font]
opt-level = 3

[profile.release.package.ratex-layout]
opt-level = 3

[profile.release.package.ratex-lexer]
opt-level = 3

[profile.release.package.ratex-parser]
opt-level = 3

[profile.release.package.read-fonts]
opt-level = 3

[profile.release.package.regex]
opt-level = 3

[profile.release.package.regex-automata]
opt-level = 3

[profile.release.package.regex-syntax]
opt-level = 3

[profile.release.package.ropey]
opt-level = 3

[profile.release.package.simd-adler32]
