[profile.release.package.vello_common]
opt-level = 3

[profile.release.package.vello_cpu]
opt-level = 3

[profile.release.package.zune-core]
opt-level = 3

[profile.release.package.zune-jpeg]
opt-level = 3

# The workspace's crates that run once per build, save or click, not per frame or keystroke.
[profile.release.package.lemmata-shell]
opt-level = "s"

[profile.release.package.lemmata-tex]
opt-level = "s"

[profile.release.package.lemmata-bib]
opt-level = "s"

[profile.release.package.lemmata-git]
opt-level = "s"

[profile.release.package.lemmata-history]
opt-level = "s"

[profile.release.package.lemmata-log]
opt-level = "s"

[profile.release.package.lemmata-synctex]
opt-level = "s"

[profile.release.package.lemmata-pkgmap]
opt-level = "s"

[profile.release.package.lemmata-grammar]
opt-level = "s"

[profile.release.package.lemmata-env]
opt-level = "s"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Tests render PDFs and images: those crates are slow unoptimised, and built once.
[profile.dev.package.hayro]
opt-level = 2

[profile.dev.package.hayro-interpret]
opt-level = 2

[profile.dev.package.hayro-syntax]
opt-level = 2

[profile.dev.package.vello_cpu]
opt-level = 2

[profile.dev.package.vello_common]
opt-level = 2

[profile.dev.package.png]
opt-level = 2

[profile.dev.package.skrifa]
opt-level = 2

[profile.dev.package.fdeflate]
opt-level = 2
