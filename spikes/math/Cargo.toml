# M1 spike, not part of the app: which pure-Rust math renderer replaces KaTeX? See docs/egui-plan.md.
[package]
name = "spike-math"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
latex-rust = { version = "3", features = ["png"] }
ratex-parser = "0.1"
ratex-layout = "0.1"
ratex-render = { version = "0.1", features = ["embed-fonts"] }
ratex-types = "0.1"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
